<h2 mat-dialog-title class="!text-lg !font-bold !text-[var(--primary-color)]">
    Add Food
</h2>

<mat-dialog-content class="text-sm !text-[var(--primary-font-color)]">
    <form [formGroup]="foodForm" (ngSubmit)="save()">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">

            <!-- Food Name -->
            <div class="md:col-span-2">
                <label class="block mb-1 text-xs font-medium text-[var(--primary-font-color)]">
                    Food Name
                </label>

                <input type="text" formControlName="foodName"
                    class="w-full rounded-md border border-[var(--border-color)] bg-[var(--surface-color)] px-3 py-2 text-sm text-[var(--primary-font-color)] outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]">

                <!-- Food Name Validation -->
                @if (
                foodForm.get('foodName')?.invalid &&
                foodForm.get('foodName')?.touched
                ) {
                <p class="mt-1 text-xs text-red-500">
                    Food name is required.
                </p>
                }
            </div>

            <!-- Category -->
            <div>
                <label class="block mb-1 text-xs font-medium text-[var(--primary-font-color)]">
                    Category
                </label>

                <input type="text" formControlName="category"
                    class="w-full rounded-md border border-[var(--border-color)] bg-[var(--surface-color)] px-3 py-2 text-sm text-[var(--primary-font-color)] outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]">
            </div>

            <!-- Serving Size -->
            <div>
                <label class="block mb-1 text-xs font-medium text-[var(--primary-font-color)]">
                    Serving Size
                </label>

                <input type="number" formControlName="servingSize"
                    class="w-full rounded-md border border-[var(--border-color)] bg-[var(--surface-color)] px-3 py-2 text-sm text-[var(--primary-font-color)] outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]">
            </div>

            <!-- Serving Unit -->
            <div>
                <label class="block mb-1 text-xs font-medium text-[var(--primary-font-color)]">
                    Serving Unit
                </label>

                <input type="text" formControlName="servingUnit"
                    class="w-full rounded-md border border-[var(--border-color)] bg-[var(--surface-color)] px-3 py-2 text-sm text-[var(--primary-font-color)] outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]">
            </div>

            <!-- Serving Grams -->
            <div>
                <label class="block mb-1 text-xs font-medium text-[var(--primary-font-color)]">
                    Serving Grams
                </label>

                <input type="number" formControlName="servingGrams"
                    class="w-full rounded-md border border-[var(--border-color)] bg-[var(--surface-color)] px-3 py-2 text-sm text-[var(--primary-font-color)] outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]">
            </div>

            <!-- Calories -->
            <div>
                <label class="block mb-1 text-xs font-medium text-[var(--primary-font-color)]">
                    Calories
                </label>

                <input type="number" formControlName="calories"
                    class="w-full rounded-md border border-[var(--border-color)] bg-[var(--surface-color)] px-3 py-2 text-sm text-[var(--primary-font-color)] outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]">
            </div>

            <!-- Protein -->
            <div>
                <label class="block mb-1 text-xs font-medium text-[var(--primary-font-color)]">
                    Protein (g)
                </label>

                <input type="number" formControlName="protein"
                    class="w-full rounded-md border border-[var(--border-color)] bg-[var(--surface-color)] px-3 py-2 text-sm text-[var(--primary-font-color)] outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]">
            </div>

            <!-- Carbs -->
            <div>
                <label class="block mb-1 text-xs font-medium text-[var(--primary-font-color)]">
                    Carbs (g)
                </label>

                <input type="number" formControlName="carbs"
                    class="w-full rounded-md border border-[var(--border-color)] bg-[var(--surface-color)] px-3 py-2 text-sm text-[var(--primary-font-color)] outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]">
            </div>

            <!-- Fat -->
            <div>
                <label class="block mb-1 text-xs font-medium text-[var(--primary-font-color)]">
                    Fat (g)
                </label>

                <input type="number" formControlName="fat"
                    class="w-full rounded-md border border-[var(--border-color)] bg-[var(--surface-color)] px-3 py-2 text-sm text-[var(--primary-font-color)] outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]">
            </div>

            <!-- Fiber -->
            <div>
                <label class="block mb-1 text-xs font-medium text-[var(--primary-font-color)]">
                    Fiber (g)
                </label>

                <input type="number" formControlName="fiber"
                    class="w-full rounded-md border border-[var(--border-color)] bg-[var(--surface-color)] px-3 py-2 text-sm text-[var(--primary-font-color)] outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]">
            </div>

            <!-- Sodium -->
            <div>
                <label class="block mb-1 text-xs font-medium text-[var(--primary-font-color)]">
                    Sodium (mg)
                </label>

                <input type="number" formControlName="sodium"
                    class="w-full rounded-md border border-[var(--border-color)] bg-[var(--surface-color)] px-3 py-2 text-sm text-[var(--primary-font-color)] outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]">
            </div>

            <!-- Sugar -->
            <div>
                <label class="block mb-1 text-xs font-medium text-[var(--primary-font-color)]">
                    Sugar (g)
                </label>

                <input type="number" formControlName="sugar"
                    class="w-full rounded-md border border-[var(--border-color)] bg-[var(--surface-color)] px-3 py-2 text-sm text-[var(--primary-font-color)] outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]">
            </div>

            <!-- Cholesterol -->
            <div>
                <label class="block mb-1 text-xs font-medium text-[var(--primary-font-color)]">
                    Cholesterol (mg)
                </label>

                <input type="number" formControlName="cholesterol"
                    class="w-full rounded-md border border-[var(--border-color)] bg-[var(--surface-color)] px-3 py-2 text-sm text-[var(--primary-font-color)] outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]">
            </div>

            <!-- Is Canned -->
            <label class="flex items-center gap-2 cursor-pointer text-[var(--primary-font-color)]">
                <input type="checkbox" formControlName="isCanned" class="accent-[var(--primary-color)]">
                <span>Is Canned</span>
            </label>

            <!-- Is Fast Food -->
            <label class="flex items-center gap-2 cursor-pointer text-[var(--primary-font-color)]">
                <input type="checkbox" formControlName="isFastFood" class="accent-[var(--primary-color)]">
                <span>Is Fast Food</span>
            </label>

        </div>

    </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="gap-1">

    <button matButton mat-dialog-close type="button" class="text-[var(--primary-font-color)]" [disabled]="isSaving">
        Cancel
    </button>

    <button matButton="elevated" type="button" class="!bg-[var(--primary-color)] !text-[var(--primary-font-color)]"
        [disabled]="isSaving" (click)="save()">
        {{ isSaving ? 'Saving...' : 'Save' }}
    </button>

</mat-dialog-actions>
