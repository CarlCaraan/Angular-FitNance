<div class="min-h-screen p-4 bg-[var(--background-color)] text-[var(--primary-font-color)]">

    <div class="max-w-full mx-auto">

        <!-- Header -->
        <div class="mb-4">
            <h1 class="text-xl font-bold">
                My Profile
            </h1>

            <p class="text-xs text-[var(--secondary-font-color)]">
                View and manage your profile information.
            </p>
        </div>

        <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="space-y-4">

            <!-- ========================= -->
            <!-- USER INFORMATION -->
            <!-- ========================= -->

            <div class="rounded-xl p-4
                       bg-[var(--surface-color)]
                       border border-[var(--border-color)]">

                <h2 class="text-sm font-semibold mb-3">
                    User Information
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">

                    <!-- Username - NOT EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            Username
                        </label>

                        <input type="text" formControlName="userProfileId" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--background-color)]
                                   text-[var(--secondary-font-color)]
                                   border border-[var(--border-color)]
                                   opacity-70
                                   cursor-not-allowed" />
                    </div>

                    <!-- Birthdate - NOT EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            Birthdate
                        </label>

                        <input type="date" formControlName="birthdate" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--background-color)]
                                   text-[var(--secondary-font-color)]
                                   border border-[var(--border-color)]
                                   opacity-70
                                   cursor-not-allowed" />
                    </div>

                    <!-- Age - NOT EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            Age
                        </label>

                        <input type="number" formControlName="age" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--background-color)]
                                   text-[var(--secondary-font-color)]
                                   border border-[var(--border-color)]
                                   opacity-70
                                   cursor-not-allowed" />
                    </div>

                    <!-- Gender - NOT EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            Gender
                        </label>

                        <input type="text" formControlName="gender" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--background-color)]
                                   text-[var(--secondary-font-color)]
                                   border border-[var(--border-color)]
                                   opacity-70
                                   cursor-not-allowed" />
                    </div>

                    <!-- First Name - EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            First Name
                        </label>

                        <input type="text" formControlName="firstName" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--surface-color)]
                                   text-[var(--primary-font-color)]
                                   border border-[var(--border-color)]
                                   placeholder:text-[var(--secondary-font-color)]
                                   focus:outline-none
                                   focus:ring-1
                                   focus:ring-[var(--primary-color)]
                                   focus:border-[var(--primary-color)]" />
                    </div>

                    <!-- Middle Name - EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            Middle Name
                        </label>

                        <input type="text" formControlName="middleName" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--surface-color)]
                                   text-[var(--primary-font-color)]
                                   border border-[var(--border-color)]
                                   placeholder:text-[var(--secondary-font-color)]
                                   focus:outline-none
                                   focus:ring-1
                                   focus:ring-[var(--primary-color)]
                                   focus:border-[var(--primary-color)]" />
                    </div>

                    <!-- Last Name - EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            Last Name
                        </label>

                        <input type="text" formControlName="lastName" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--surface-color)]
                                   text-[var(--primary-font-color)]
                                   border border-[var(--border-color)]
                                   placeholder:text-[var(--secondary-font-color)]
                                   focus:outline-none
                                   focus:ring-1
                                   focus:ring-[var(--primary-color)]
                                   focus:border-[var(--primary-color)]" />
                    </div>

                </div>
            </div>


            <!-- ========================= -->
            <!-- BODY INFORMATION -->
            <!-- ========================= -->

            <div class="rounded-xl p-4
                       bg-[var(--surface-color)]
                       border border-[var(--border-color)]">

                <h2 class="text-sm font-semibold mb-3">
                    Body Information
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">

                    <!-- Height - EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            Height (cm)
                        </label>

                        <input type="number" formControlName="height" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--surface-color)]
                                   text-[var(--primary-font-color)]
                                   border border-[var(--border-color)]
                                   placeholder:text-[var(--secondary-font-color)]
                                   focus:outline-none
                                   focus:ring-1
                                   focus:ring-[var(--primary-color)]
                                   focus:border-[var(--primary-color)]" />
                    </div>

                    <!-- Weight - EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            Weight (kg)
                        </label>

                        <input type="number" formControlName="weight" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--surface-color)]
                                   text-[var(--primary-font-color)]
                                   border border-[var(--border-color)]
                                   placeholder:text-[var(--secondary-font-color)]
                                   focus:outline-none
                                   focus:ring-1
                                   focus:ring-[var(--primary-color)]
                                   focus:border-[var(--primary-color)]" />
                    </div>

                    <!-- BMI - NOT EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            Current BMI
                        </label>

                        <input type="number" formControlName="currentBMI" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--background-color)]
                                   text-[var(--secondary-font-color)]
                                   border border-[var(--border-color)]
                                   opacity-70
                                   cursor-not-allowed" />
                    </div>

                    <!-- Activity Level - NOT EDITABLE -->
                    <!-- Activity Level - NOT EDITABLE -->
                    <div>

                        <label class="block mb-1 text-xs font-medium">
                            Activity Level
                        </label>

                        <select formControlName="activityLevelId" class="w-full px-3 py-1.5 rounded-lg text-sm
               bg-[var(--background-color)]
               text-[var(--secondary-font-color)]
               border border-[var(--border-color)]
               opacity-70
               cursor-not-allowed">

                            <option value="">
                                Select Activity Level
                            </option>

                            @for (activity of activityLevels; track activity.activityLevelId) {

                            <option [value]="activity.activityLevelId">
                                {{ activity.activityLevelName }}
                            </option>

                            }

                        </select>

                    </div>

                    <!-- Fitness Goal - EDITABLE -->
                    <div>

                        <label class="block mb-1 text-xs font-medium">
                            Fitness Goal
                        </label>

                        <select formControlName="fitnessGoalId" class="w-full px-3 py-1.5 rounded-lg text-sm
               bg-[var(--surface-color)]
               text-[var(--primary-font-color)]
               border border-[var(--border-color)]
               focus:outline-none
               focus:ring-1
               focus:ring-[var(--primary-color)]
               focus:border-[var(--primary-color)]">

                            <option value="">
                                Select Fitness Goal
                            </option>

                            @for (goal of nutritionGoals; track goal.goalId) {

                            <option [value]="goal.goalId">
                                {{ goal.goalName }}
                            </option>

                            }

                        </select>

                    </div>

                </div>
            </div>


            <!-- ========================= -->
            <!-- FINANCE -->
            <!-- ========================= -->

            <div class="rounded-xl p-4
                       bg-[var(--surface-color)]
                       border border-[var(--border-color)]">

                <h2 class="text-sm font-semibold mb-3">
                    Finance
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">

                    <!-- Monthly Income - EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            Monthly Income
                        </label>

                        <input type="number" formControlName="monthlyIncome" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--surface-color)]
                                   text-[var(--primary-font-color)]
                                   border border-[var(--border-color)]
                                   placeholder:text-[var(--secondary-font-color)]
                                   focus:outline-none
                                   focus:ring-1
                                   focus:ring-[var(--primary-color)]
                                   focus:border-[var(--primary-color)]" />
                    </div>

                    <!-- Savings Goal - EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            Savings Goal
                        </label>

                        <input type="number" formControlName="savingsGoal" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--surface-color)]
                                   text-[var(--primary-font-color)]
                                   border border-[var(--border-color)]
                                   placeholder:text-[var(--secondary-font-color)]
                                   focus:outline-none
                                   focus:ring-1
                                   focus:ring-[var(--primary-color)]
                                   focus:border-[var(--primary-color)]" />
                    </div>

                    <!-- Current Savings - EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            Current Savings
                        </label>

                        <input type="number" formControlName="currentSavings" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--surface-color)]
                                   text-[var(--primary-font-color)]
                                   border border-[var(--border-color)]
                                   placeholder:text-[var(--secondary-font-color)]
                                   focus:outline-none
                                   focus:ring-1
                                   focus:ring-[var(--primary-color)]
                                   focus:border-[var(--primary-color)]" />
                    </div>

                </div>
            </div>


            <!-- ========================= -->
            <!-- NUTRITION TARGET -->
            <!-- ========================= -->

            <div class="rounded-xl p-4
                       bg-[var(--surface-color)]
                       border border-[var(--border-color)]">

                <h2 class="text-sm font-semibold mb-3">
                    Nutrition Target
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">

                    <!-- Target Calories - NOT EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            Target Calories
                        </label>

                        <input type="number" formControlName="targetCalories" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--background-color)]
                                   text-[var(--secondary-font-color)]
                                   border border-[var(--border-color)]
                                   opacity-70
                                   cursor-not-allowed" />
                    </div>

                    <!-- Target Protein - NOT EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            Target Protein
                        </label>

                        <input type="number" formControlName="targetProtein" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--background-color)]
                                   text-[var(--secondary-font-color)]
                                   border border-[var(--border-color)]
                                   opacity-70
                                   cursor-not-allowed" />
                    </div>

                    <!-- Target Carbs - NOT EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            Target Carbs
                        </label>

                        <input type="number" formControlName="targetCarbs" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--background-color)]
                                   text-[var(--secondary-font-color)]
                                   border border-[var(--border-color)]
                                   opacity-70
                                   cursor-not-allowed" />
                    </div>

                    <!-- Target Fat - NOT EDITABLE -->
                    <div>
                        <label class="block mb-1 text-xs font-medium">
                            Target Fat
                        </label>

                        <input type="number" formControlName="targetFat" class="w-full px-3 py-1.5 rounded-lg text-sm
                                   bg-[var(--background-color)]
                                   text-[var(--secondary-font-color)]
                                   border border-[var(--border-color)]
                                   opacity-70
                                   cursor-not-allowed" />
                    </div>

                </div>
            </div>



            <!-- ========================= -->
            <!-- SAVE BUTTON -->
            <!-- ========================= -->

            <div class="flex items-center justify-start gap-3">

                <button type="submit" [disabled]="isSaving" class="px-5 py-2 rounded-lg text-sm
               bg-[var(--primary-color)]
               text-white
               font-semibold
               hover:opacity-90
               transition
               disabled:opacity-50">

                    {{ isSaving ? 'Saving...' : 'Save Changes' }}

                </button>

                @if (showSaved()) {
                <span class="text-sm text-[var(--secondary-font-color)]">
                    saved.
                </span>
                }

            </div>

        </form>

    </div>

</div>
